name: wuxingxiangqi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^13.1.0
  gbk_codec: ^0.4.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - engine/windows/
    - assets/images/
    - assets/images/app/
    - assets/images/bg/
    - assets/images/boards/
    - assets/images/pieces/
    - assets/images/pieces/黑白简约/
    - assets/images/pieces/红绿石头/
    - assets/canju/
    - assets/sounds/chess/

# 应用图标生成配置（运行 dart run flutter_launcher_icons 生效）
flutter_launcher_icons:
  image_path: "assets/images/app/icon.png"
  android: true
  min_sdk_android: 21
  # 自适应图标：前景为图标本身并留出安全区内边距，背景取图标照片的浅米色
  adaptive_icon_background: "#F2EDE2"
  adaptive_icon_foreground: "assets/images/app/icon.png"
  adaptive_icon_foreground_padding: 20
  windows:
    generate: true
    image_path: "assets/images/app/icon.png"
    icon_size: 256
